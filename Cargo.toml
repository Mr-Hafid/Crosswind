[workspace]
resolver = "3"
members = ["crates/*", "apps/crosswind-app/src-tauri"]
default-members = [
    "crates/crosswind-core",
    "crates/crosswind-awdl",
    "crates/crosswind-airdrop",
    "crates/crosswind-cli",
    "apps/crosswind-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Mr-Hafid/crosswind"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"
