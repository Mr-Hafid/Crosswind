[package]
name = "crosswind-linux"
description = "The crosswind command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish = false

[[bin]]
name = "crosswind-linux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
nix = { version = "0.31", default-features = false, features = ["hostname", "net", "signal", "user"] }
crosswind-airdrop = { path = "../crosswind-airdrop", features = ["mdns"] }
crosswind-awdl = { path = "../crosswind-awdl" }
crosswind-radio = { path = "../crosswind-radio" }
crosswindd = { path = "../crosswindd" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
