[package]
name = "crosswindd"
description = "The Crosswind system service: radio leases and the system D-Bus API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
publish = false

# The D-Bus API's names and client proxy, for crosswind-linux and omdrop.
[lib]
path = "src/lib.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false }
nix = { version = "0.31", default-features = false, features = ["signal", "user"] }
crosswind-radio = { path = "../crosswind-radio" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
