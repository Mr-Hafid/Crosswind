# NetworkManager must leave alone the interfaces Crosswind's radio creates.
#
# awdl0 is AWDL's TAP device: a managed one is given a randomised MAC and no
# IPv6 link-local, and the link-local is the only address a transfer can be
# delivered to. cwmon0 is the monitor interface AWDL injects through,
# cwibss0 exclusive mode's ad-hoc cell, and cwap0 its hidden AP on cards
# with no ad-hoc mode. Managing them has kept the phone from ever being
# heard, and crashed iwlwifi's firmware a second into a session.
#
# A device section of its own rather than keyfile's unmanaged-devices: that
# is one key, so another package's file setting it replaced this list (as
# legacy omdrop's 99-omdrop-unmanaged.conf did), while device
# sections with different names all apply.
#
# This is the vendor copy. Override it with a file of the same name in
# /etc/NetworkManager/conf.d/, which NetworkManager reads in its place.
[device-crosswind-unmanaged]
match-device=interface-name:awdl0;interface-name:cwmon0;interface-name:cwibss0;interface-name:cwap0
managed=0
